<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Destaques — Japurá Pneus</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Japura brand — mesmas variaveis do original dark, cores remapeadas */
    --bg: #f0efee;
    --surface: #ffffff;
    --surface2: #f7f5f4;
    --border: #dddbd9;
    --gold: #3e3f40;
    --gold-dim: #2a2b2c;
    --blue: #3a5f8a;
    --green: #4a7c5f;
    --purple: #6b5b8a;
    --orange: #b5442a;
    --teal: #3a7a6a;
    --pink: #8a3a5b;
    --text: #3e3f40;
    --text-muted: #827f7f;
    --text-dim: #aaa8a6;
    --radius: 12px;
    --radius-sm: 8px;
    --dark: #3e3f40; --mid: #827f7f; --light: #f0efee;
    --white: #ffffff; --red: #b5442a; --muted: #827f7f;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
  body::before { content:''; position:fixed; inset:0; background:radial-gradient(ellipse 80% 40% at 20% 0%,rgba(62,63,64,0.05) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 80% 100%,rgba(130,127,127,0.04) 0%,transparent 60%); pointer-events:none; z-index:0; }
  .app { position:relative; z-index:1; max-width:1400px; margin:0 auto; padding:32px 24px; }

  /* HEADER */
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:36px; gap:16px; flex-wrap:wrap; padding-bottom:24px; border-bottom:1px solid var(--border); }
  .header-brand { display:flex; align-items:center; gap:14px; }
  .header-brand svg { width:40px; height:33px; flex-shrink:0; }
  .header-brand-sep { width:1px; height:36px; background:var(--border); }
  .header-brand-text h1 { font-family:'Arial Black','Arial',sans-serif; font-weight:900; font-size:clamp(16px,2.5vw,22px); letter-spacing:-.3px; text-transform:uppercase; color:var(--dark); line-height:1.1; }
  .header-brand-text p { font-family:'Inter',sans-serif; font-size:12px; color:var(--muted); margin-top:2px; font-weight:400; }
  .header-right { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

  .btn { display:inline-flex; align-items:center; gap:6px; padding:9px 18px; border-radius:var(--radius-sm); font-family:'Inter',sans-serif; font-size:13px; font-weight:500; cursor:pointer; border:none; transition:all .2s; }
  .btn-dark { background:var(--dark); color:var(--white); }
  .btn-dark:hover { background:#2a2b2c; transform:translateY(-1px); box-shadow:0 4px 12px rgba(62,63,64,0.2); }
  .btn-outline { background:transparent; color:var(--muted); border:1px solid var(--border); }
  .btn-outline:hover { border-color:var(--dark); color:var(--dark); }

  /* STATS */
  .stats-bar { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; margin-bottom:28px; }
  .stat-card { background:var(--white); border:1px solid var(--border); border-radius:var(--radius); padding:20px; position:relative; overflow:hidden; transition:border-color .2s,box-shadow .2s; }
  .stat-card:hover { border-color:var(--mid); box-shadow:0 2px 12px rgba(62,63,64,0.08); }
  .stat-card::after { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:var(--accent,var(--dark)); border-radius:2px 2px 0 0; }
  .stat-label { font-family:'Inter',sans-serif; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.9px; color:var(--muted); margin-bottom:8px; }
  .stat-val { font-family:'Arial Black','Arial',sans-serif; font-weight:900; font-size:30px; line-height:1; color:var(--accent,var(--dark)); }
  .stat-sub { font-family:'Inter',sans-serif; font-size:11px; color:var(--muted); margin-top:4px; }

  /* LAYOUT */
  .grid-main { display:grid; grid-template-columns:270px 1fr; gap:20px; align-items:start; }
  @media(max-width:900px){.grid-main{grid-template-columns:1fr;}}
  .sidebar { display:flex; flex-direction:column; gap:16px; }

  .card { background:var(--white); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:0 1px 4px rgba(62,63,64,0.04); }
  .card-header { padding:14px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .card-header h3 { font-family:'Inter',sans-serif; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }

  /* MONTH LIST */
  .month-list { padding:8px; }
  .month-item { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-radius:var(--radius-sm); cursor:pointer; transition:all .15s; gap:8px; border:1px solid transparent; }
  .month-item:hover { background:var(--surface2); }
  .month-item.active { background:rgba(62,63,64,0.06); border-color:rgba(62,63,64,0.2); }
  .month-item-left { display:flex; align-items:center; gap:10px; }
  .month-dot { width:7px; height:7px; border-radius:50%; background:var(--border); flex-shrink:0; transition:background .2s; }
  .month-item.has-data .month-dot { background:var(--green); }
  .month-item.is-current .month-dot { background:var(--dark); box-shadow:0 0 5px rgba(62,63,64,0.4); }
  .month-name { font-family:'Inter',sans-serif; font-size:13px; font-weight:500; color:var(--text); }
  .month-date { font-family:'Inter',sans-serif; font-size:10px; color:var(--muted); }
  .month-count { font-family:'Inter',sans-serif; font-size:11px; font-weight:600; background:var(--surface2); color:var(--muted); padding:2px 7px; border-radius:20px; min-width:24px; text-align:center; }
  .month-item.active .month-count { background:var(--dark); color:var(--white); }

  /* MAIN */
  .main-content { display:flex; flex-direction:column; gap:20px; }
  .section-head { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  .section-title { font-family:'Arial Black','Arial',sans-serif; font-weight:900; font-size:18px; text-transform:uppercase; letter-spacing:-.3px; color:var(--dark); }
  .section-title .month-label { color:var(--mid); }
  .update-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(74,124,95,0.08); border:1px solid rgba(74,124,95,0.25); color:var(--green); font-family:'Inter',sans-serif; font-size:11px; font-weight:500; padding:4px 10px; border-radius:20px; }
  .badge-dot { width:6px; height:6px; border-radius:50%; background:var(--green); animation:pulse 2s infinite; }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  /* CARDS */
  .highlights-area { display:flex; flex-direction:column; gap:10px; }
  .highlight-card { background:var(--white); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; display:grid; grid-template-columns:46px 1fr auto; gap:16px; align-items:center; transition:all .2s; position:relative; overflow:hidden; box-shadow:0 1px 4px rgba(62,63,64,0.04); }
  .highlight-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--card-color,var(--mid)); border-radius:3px 0 0 3px; }
  .highlight-card:hover { border-color:var(--mid); transform:translateX(2px); box-shadow:0 3px 12px rgba(62,63,64,0.1); }
  .avatar { width:46px; height:46px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-family:'Arial Black','Arial',sans-serif; font-size:16px; font-weight:900; flex-shrink:0; }
  .card-info { min-width:0; }
  .card-name { font-family:'Arial Black','Arial',sans-serif; font-weight:900; font-size:14px; margin-bottom:5px; color:var(--dark); text-transform:uppercase; letter-spacing:-.2px; }
  .card-meta { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .chip { display:inline-flex; align-items:center; gap:4px; font-family:'Inter',sans-serif; font-size:11px; font-weight:500; padding:2px 8px; border-radius:20px; background:var(--surface2); color:var(--muted); border:1px solid var(--border); }
  .chip.sector { color:var(--blue); border-color:rgba(58,95,138,.2); background:rgba(58,95,138,.06); }
  .chip.indicated { color:var(--purple); border-color:rgba(107,91,138,.2); background:rgba(107,91,138,.06); }
  .card-reason { font-family:'Inter',sans-serif; font-size:12px; color:var(--muted); margin-top:6px; font-style:italic; line-height:1.5; }
  .card-actions { display:flex; gap:6px; }
  .icon-btn { width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px; transition:all .15s; }
  .icon-btn.danger:hover { border-color:var(--red); color:var(--red); background:rgba(181,68,42,0.06); }

  /* SECTOR CHART */
  .sector-grid { display:flex; flex-direction:column; gap:10px; padding:16px; }
  .sector-row { display:flex; flex-direction:column; gap:4px; }
  .sector-row-head { display:flex; justify-content:space-between; font-family:'Inter',sans-serif; font-size:12px; }
  .sector-row-name { font-weight:500; color:var(--text); }
  .sector-row-count { color:var(--muted); }
  .sector-bar-bg { height:5px; background:var(--surface2); border-radius:3px; overflow:hidden; }
  .sector-bar { height:100%; background:var(--mid); border-radius:3px; transition:width .6s cubic-bezier(.4,0,.2,1); }

  /* TIMELINE */
  .timeline { display:grid; grid-template-columns:repeat(12,1fr); gap:4px; padding:16px; }
  .tl-month { display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; }
  .tl-bar-wrap { width:100%; height:44px; background:var(--surface2); border-radius:4px; display:flex; align-items:flex-end; overflow:hidden; border:1px solid var(--border); transition:border-color .2s; }
  .tl-month:hover .tl-bar-wrap,.tl-month.active .tl-bar-wrap { border-color:var(--dark); }
  .tl-bar { width:100%; background:var(--mid); opacity:.7; transition:height .5s cubic-bezier(.4,0,.2,1); border-radius:2px 2px 0 0; }
  .tl-month.active .tl-bar { opacity:1; background:var(--dark); }
  .tl-label { font-family:'Inter',sans-serif; font-size:9px; color:var(--muted); text-align:center; font-weight:600; letter-spacing:.5px; }
  .tl-count { font-family:'Inter',sans-serif; font-size:10px; color:var(--dark); font-weight:700; }

  .empty-state { background:var(--white); border:1px dashed var(--border); border-radius:var(--radius); padding:56px 30px; text-align:center; }
  .empty-icon { font-size:36px; margin-bottom:12px; }
  .empty-title { font-family:'Arial Black','Arial',sans-serif; font-weight:900; font-size:14px; text-transform:uppercase; letter-spacing:-.2px; margin-bottom:6px; color:var(--dark); }
  .empty-sub { font-family:'Inter',sans-serif; font-size:13px; color:var(--muted); }

  .loading { display:flex; align-items:center; justify-content:center; padding:40px; color:var(--muted); gap:10px; font-family:'Inter',sans-serif; font-size:14px; }
  .spinner { width:18px; height:18px; border:2px solid var(--border); border-top-color:var(--dark); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin{to{transform:rotate(360deg)}}

  .live-badge { display:inline-flex; align-items:center; gap:5px; font-family:'Inter',sans-serif; font-size:11px; color:var(--green); font-weight:500; }
  .live-dot { width:6px; height:6px; border-radius:50%; background:var(--green); animation:pulse 2s infinite; }

  .toast { position:fixed; bottom:24px; right:24px; background:var(--white); border:1px solid var(--border); color:var(--dark); padding:12px 20px; border-radius:var(--radius-sm); font-family:'Inter',sans-serif; font-size:13px; font-weight:500; z-index:200; transform:translateY(60px); opacity:0; transition:all .3s; box-shadow:0 4px 16px rgba(62,63,64,0.12); }
  .toast.show { transform:translateY(0); opacity:1; }

  ::-webkit-scrollbar{width:5px}
  ::-webkit-scrollbar-track{background:var(--light)}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

  @media(max-width:600px){
    .stats-bar{grid-template-columns:repeat(2,1fr)}
    .highlight-card{grid-template-columns:40px 1fr}
    .card-actions{display:none}
    .timeline{grid-template-columns:repeat(6,1fr)}
  }
</style>
</head>

  <header>
<!-- logo already there -->

      <div class="header-brand-sep"></div>
      <div class="header-brand-text">
        <h1>Japurá Pneus</h1>
        <p id="date-label">Carregando...</p>
      </div>
    </div>
    <div class="header-right">
      <span class="live-badge"><span class="live-dot"></span>Tempo real</span>
      <button class="btn btn-outline" onclick="exportCSV()">&#8595; Exportar CSV</button>
      <button class="btn btn-dark" onclick="location.reload()">&#8635; Atualizar</button>
    </div>
  </header>

  <div class="stats-bar">
    <div class="stat-card" style="--accent:var(--dark)"><div class="stat-label">Total Destaques</div><div class="stat-val" id="stat-total">—</div><div class="stat-sub">em 2026</div></div>
    <div class="stat-card" style="--accent:var(--green)"><div class="stat-label">Meses Registrados</div><div class="stat-val" id="stat-months">—</div><div class="stat-sub">de 12 meses</div></div>
    <div class="stat-card" style="--accent:var(--blue)"><div class="stat-label">Setores Ativos</div><div class="stat-val" id="stat-sectors">—</div><div class="stat-sub">diferentes</div></div>
    <div class="stat-card" style="--accent:var(--mid)"><div class="stat-label">Proxima Quinta</div><div class="stat-val" id="stat-days" style="font-size:22px;padding-top:4px">—</div><div class="stat-sub" id="stat-next-label">dias</div></div>
  </div>

  <div class="card" style="margin-bottom:20px">
    <div class="card-header"><h3>Visao Anual — Destaques por Mes</h3></div>
    <div class="timeline" id="timeline"></div>
  </div>

  <div class="grid-main">
    <div class="sidebar">
      <div class="card">
        <div class="card-header"><h3>Meses / Datas</h3></div>
        <div class="month-list" id="month-list"></div>
      </div>
      <div class="card">
        <div class="card-header"><h3>Por Setor</h3></div>
        <div class="sector-grid" id="sector-chart"></div>
      </div>
    </div>
    <div class="main-content">
      <div class="section-head">
        <div class="section-title">Destaques de <span class="month-label" id="selected-label">—</span></div>
        <div class="update-badge"><div class="badge-dot"></div><span id="badge-date">—</span></div>
      </div>
      <div class="highlights-area" id="highlights-area">
        <div class="loading"><div class="spinner"></div>Carregando dados...</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL='https://obmczqorijdcfkbnzvyt.supabase.co', SB_KEY='sb_publishable_amkuYtweEA4m-CszT5S-GA_8QOfjb4w';
const MONTHS=["Janeiro","Fevereiro","Marco","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const THURSDAYS=["29/01/2026","26/02/2026","26/03/2026","30/04/2026","28/05/2026","25/06/2026","30/07/2026","27/08/2026","24/09/2026","29/10/2026","26/11/2026","31/12/2026"];
const COLORS=["#3e3f40","#827f7f","#4a7c5f","#3a5f8a","#6b5b8a","#8a5b3a","#3a7a8a","#6b3a5b","#5b6b3a","#8a3a4a","#3a5b6b","#6b8a3a"];

let allData=[], selectedMonth=new Date().getMonth();

function colorFor(s){let h=0;for(let c of(s||''))h=(h*31+c.charCodeAt(0))&0xffffffff;return COLORS[Math.abs(h)%COLORS.length];}
function initials(n){return(n||'?').split(' ').slice(0,2).map(x=>x[0]).join('').toUpperCase();}
function daysUntil(ds){const[d,m,y]=ds.split('/').map(Number);const t=new Date(y,m-1,d);const now=new Date();now.setHours(0,0,0,0);return Math.round((t-now)/86400000);}

async function fetchData(){
  try{
    const res=await fetch(SB_URL+'/rest/v1/destaques?select=*&order=criado_em.desc',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
    if(!res.ok)throw new Error();
    allData=await res.json(); renderAll();
  }catch(e){document.getElementById('highlights-area').innerHTML='<div class="empty-state"><div class="empty-icon">&#9888;</div><div class="empty-title">Erro ao carregar</div><div class="empty-sub">Verifique sua conexao</div></div>';}
}

async function deleteRecord(id,name){
  if(!confirm('Remover "'+name+'"?'))return;
  try{
    const res=await fetch(SB_URL+'/rest/v1/destaques?id=eq.'+id,{method:'DELETE',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
    if(!res.ok)throw new Error();
    allData=allData.filter(x=>x.id!==id); renderAll(); showToast(name+' removido');
  }catch(e){showToast('Erro ao remover',true);}
}

function renderStats(){
  document.getElementById('stat-total').textContent=allData.length;
  document.getElementById('stat-months').textContent=new Set(allData.map(x=>x.mes)).size;
  document.getElementById('stat-sectors').textContent=new Set(allData.map(x=>(x.setor||'').trim().toLowerCase()).filter(Boolean)).size;
  let min=Infinity,lbl='';
  THURSDAYS.forEach((t,i)=>{const d=daysUntil(t);if(d>=0&&d<min){min=d;lbl=MONTHS[i];}});
  if(min===Infinity){document.getElementById('stat-days').textContent='OK';document.getElementById('stat-next-label').textContent='Ano concluido';}
  else if(min===0){document.getElementById('stat-days').textContent='Hoje!';document.getElementById('stat-next-label').textContent=lbl;}
  else{document.getElementById('stat-days').textContent=min;document.getElementById('stat-next-label').textContent='dias — '+lbl;}
}

function renderMonthList(){
  const el=document.getElementById('month-list'), cur=new Date().getMonth();
  el.innerHTML=MONTHS.map((m,i)=>{
    const count=allData.filter(x=>x.mes===i).length;
    return '<div class="month-item'+(i===selectedMonth?' active':'')+(i===cur?' is-current':'')+(count>0?' has-data':'')+'" onclick="selectedMonth='+i+';renderAll()"><div class="month-item-left"><div class="month-dot"></div><div><div class="month-name">'+m+'</div><div class="month-date">'+THURSDAYS[i]+'</div></div></div><div class="month-count">'+count+'</div></div>';
  }).join('');
}

function renderSectors(){
  const el=document.getElementById('sector-chart'), map={};
  allData.forEach(x=>{const s=(x.setor||'Sem setor').trim();map[s]=(map[s]||0)+1;});
  const sorted=Object.entries(map).sort((a,b)=>b[1]-a[1]);
  if(!sorted.length){el.innerHTML='<div style="padding:16px;font-size:12px;font-family:Inter,sans-serif;color:var(--muted);text-align:center">Nenhum dado ainda</div>';return;}
  const max=sorted[0][1];
  el.innerHTML=sorted.map(([n,c])=>'<div class="sector-row"><div class="sector-row-head"><span class="sector-row-name">'+n+'</span><span class="sector-row-count">'+c+'</span></div><div class="sector-bar-bg"><div class="sector-bar" style="width:'+((c/max)*100)+'%;background:'+colorFor(n)+'"></div></div></div>').join('');
}

function renderTimeline(){
  const el=document.getElementById('timeline');
  const counts=MONTHS.map((_,i)=>allData.filter(x=>x.mes===i).length);
  const max=Math.max(...counts,1);
  const abbr=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  el.innerHTML=MONTHS.map((_,i)=>'<div class="tl-month'+(i===selectedMonth?' active':'')+'" onclick="selectedMonth='+i+';renderAll()"><div class="tl-bar-wrap"><div class="tl-bar" style="height:'+(counts[i]?Math.max(8,(counts[i]/max)*100)+'%':'0%')+'"></div></div><div class="tl-label">'+abbr[i]+'</div><div class="tl-count">'+(counts[i]||'')+'</div></div>').join('');
}

function renderHighlights(){
  document.getElementById('selected-label').textContent=MONTHS[selectedMonth];
  document.getElementById('badge-date').textContent='Atualiza em '+THURSDAYS[selectedMonth];
  const area=document.getElementById('highlights-area');
  const list=allData.filter(x=>x.mes===selectedMonth);
  if(!list.length){area.innerHTML='<div class="empty-state"><div class="empty-icon">&#127775;</div><div class="empty-title">Nenhum destaque em '+MONTHS[selectedMonth]+'</div><div class="empty-sub">Aguardando indicacoes pelo formulario</div></div>';return;}
  area.innerHTML=list.map(h=>{
    const color=colorFor(h.nome), date=h.criado_em?new Date(h.criado_em).toLocaleDateString('pt-BR'):'';
    return '<div class="highlight-card" style="--card-color:'+color+'"><div class="avatar" style="background:'+color+'18;color:'+color+'">'+initials(h.nome)+'</div><div class="card-info"><div class="card-name">'+h.nome+'</div><div class="card-meta">'+(h.setor?'<span class="chip sector">&#127970; '+h.setor+'</span>':'')+(h.indicado_por?'<span class="chip indicated">&#128100; '+h.indicado_por+'</span>':'')+(date?'<span class="chip">'+date+'</span>':'')+'</div>'+(h.motivo?'<div class="card-reason">"'+h.motivo+'"</div>':'')+'</div><div class="card-actions"><button class="icon-btn danger" onclick="deleteRecord(\''+h.id+'\',\''+h.nome+'\')">&#10005;</button></div></div>';
  }).join('');
}

function renderAll(){renderStats();renderMonthList();renderSectors();renderTimeline();renderHighlights();}

function exportCSV(){
  const rows=[['Mes','Nome','Setor','Motivo','Indicado Por','Data']];
  allData.forEach(h=>rows.push([MONTHS[h.mes],h.nome,h.setor,h.motivo,h.indicado_por,h.criado_em?new Date(h.criado_em).toLocaleDateString('pt-BR'):'']));
  const csv=rows.map(r=>r.map(c=>'"'+(c||'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv); a.download='destaques_japura_2026.csv'; a.click();
  showToast('CSV exportado!');
}

function showToast(msg,warn){
  const t=document.getElementById('toast'); t.textContent=msg;
  t.style.borderColor=warn?'var(--red)':'var(--green)'; t.style.color=warn?'var(--red)':'var(--green)';
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000);
}

document.getElementById('date-label').textContent='Destaques 2026 — '+new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
fetchData();
setInterval(fetchData,30000);
</script>
</body>
</html>
